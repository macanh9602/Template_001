<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[Tiêu đề] — visualiser</title>
<!--
  KHUNG NỀN cho mọi visualiser trong pack.
  Copy file này → đổi tên → điền phần MAIN. Giữ nguyên CSS để mọi visualiser trông giống nhau.

  LUẬT (workflow/ask-and-visualise.md):
  1. Self-contained — inline hết CSS/JS, không CDN, không fetch file ngoài.
     Dev mở bằng double-click, không chạy server.
  2. So sánh phải đặt CẠNH NHAU, cùng lúc. Không bắt người xem nhớ lại cái vừa xem.
  3. Có slider/nút chỉnh tại chỗ, và LUÔN hiển thị SỐ hiện tại — số đó là thứ dev đọc ra để chốt.
  4. Nhãn bằng technical term, không phải "Option A/B/C".
  5. KHÔNG nội suy điểm dữ liệu khuyết. KHÔNG vẽ hai trục X khác bản chất lên cùng biểu đồ.
     KHÔNG hiển thị nhiều chữ số hơn độ chính xác thật có.
  6. Ghi rõ điều kiện đo / giả định ngay trên trang.
-->
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#262d38; --tx:#e6edf3; --dim:#8b949e;
    --acc:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:16px 20px;border-bottom:1px solid var(--line)}
  h1{font-size:16px;margin:0 0 4px;font-weight:600}
  .sub{color:var(--dim);font-size:12px}
  .wrap{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 62px)}
  .side{border-right:1px solid var(--line);padding:16px;overflow:auto}
  .main{padding:16px;overflow:auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
  .card h2{font-size:12px;margin:0 0 10px;color:var(--dim);text-transform:uppercase;
           letter-spacing:.06em;font-weight:600}
  label{display:block;font-size:12px;color:var(--dim);margin:10px 0 3px}
  .val{float:right;color:var(--acc);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc)}
  select,input[type=number]{width:100%;background:#0d1117;color:var(--tx);
       border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px}
  button{background:#21262d;color:var(--tx);border:1px solid var(--line);border-radius:6px;
         padding:7px 12px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--acc)}
  button.on{background:var(--acc);color:#04121f;border-color:var(--acc);font-weight:600}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:600}
  code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#79c0ff}
  canvas{display:block;width:100%;height:auto;background:#0d1117;
         border:1px solid var(--line);border-radius:6px}
  .note{font-size:12px;color:var(--dim);border-left:2px solid var(--warn);padding-left:10px;margin:10px 0}
  .cond{font-size:11px;color:var(--dim);font-family:ui-monospace,monospace;
        background:#0d1117;border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:14px}
  .pill{display:inline-block;font-size:10px;padding:1px 7px;border-radius:99px;
        border:1px solid var(--line);color:var(--dim)}
  .pill.ok{color:var(--ok);border-color:#1f4d2c} .pill.warn{color:var(--warn);border-color:#4d3f14}
  .pill.bad{color:var(--bad);border-color:#5c2320}
</style>
</head>
<body>
<header>
  <h1>[Tiêu đề — câu hỏi đang cần chốt]</h1>
  <div class="sub">[một dòng: nhìn cái gì, để quyết cái gì]</div>
</header>

<div class="wrap">
  <div class="side">
    <div class="card">
      <h2>Tham số</h2>
      <label>Ví dụ <span class="val" id="vX">0.30</span></label>
      <input type="range" id="x" min="0" max="1" step="0.01" value="0.30">
    </div>
    <div class="card">
      <h2>Số để chốt</h2>
      <table id="out"></table>
      <div class="note">Số chốt đi vào Profile SO / prefab field / level data — không hardcode.</div>
    </div>
  </div>

  <div class="main">
    <div class="cond">
      Điều kiện / giả định: [thiết bị, phiên bản công cụ, N mẫu, dữ liệu lấy từ đâu, cái gì là ước lượng]
    </div>

    <div class="card">
      <h2>So sánh cạnh nhau</h2>
      <div class="grid g3" id="panes"><!-- MAIN: các phương án, nhãn bằng technical term --></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

/* helper: vẽ trục + series, KHÔNG nội suy điểm khuyết (null = ngắt đoạn) */
function plot(canvas, series, opts={}){
  const g=canvas.getContext('2d'), P=28, W=canvas.width-P*2, H=canvas.height-P*2;
  g.clearRect(0,0,canvas.width,canvas.height);
  g.strokeStyle='#262d38'; g.lineWidth=1; g.strokeRect(P,P,W,H);
  const xs=series.flatMap(s=>s.points.filter(p=>p&&p[1]!=null).map(p=>p[0]));
  const ys=series.flatMap(s=>s.points.filter(p=>p&&p[1]!=null).map(p=>p[1]));
  const x0=opts.x0??Math.min(...xs), x1=opts.x1??Math.max(...xs);
  const y0=opts.y0??Math.min(0,...ys), y1=opts.y1??Math.max(...ys);
  const X=v=>P+(v-x0)/(x1-x0||1)*W, Y=v=>P+H-(v-y0)/(y1-y0||1)*H;
  series.forEach(s=>{
    g.strokeStyle=s.color||'#58a6ff'; g.lineWidth=2; g.beginPath(); let pen=false;
    s.points.forEach(p=>{
      if(!p||p[1]==null){ pen=false; return; }         // điểm khuyết → ngắt, KHÔNG nối
      const x=X(p[0]), y=Y(p[1]);
      pen?g.lineTo(x,y):g.moveTo(x,y); pen=true;
    });
    g.stroke();
    if(s.dots!==false){ g.fillStyle=s.color||'#58a6ff';
      s.points.forEach(p=>{ if(p&&p[1]!=null){ g.beginPath();
        g.arc(X(p[0]),Y(p[1]),2.5,0,7); g.fill(); } }); }
  });
  g.fillStyle='#4d5866'; g.font='10px ui-monospace,monospace';
  g.fillText(opts.xLabel||'x', P+W-30, P+H+16);
  g.fillText(opts.yLabel||'y', 4, P-8);
}

/* helper: làm tròn theo độ chính xác THẬT, đừng in thừa chữ số */
const fmt=(v,d=2)=>Number(v).toFixed(d);

function render(){
  $('vX').textContent = fmt($('x').value);
  $('out').innerHTML = '<tr><th>Tham số</th><th>Giá trị</th></tr>'
    + `<tr><td>x</td><td><code>${fmt($('x').value)}</code></td></tr>`;
  /* MAIN: cập nhật các pane */
}
$('x').addEventListener('input', render);
render();
</script>
</body>
</html>
